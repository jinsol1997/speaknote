spring.application.name=speaknote

spring.datasource.url=jdbc:mysql://localhost:3306/speaknote?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=0603
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.speaknote.speaknote.domain
mybatis.configuration.map-underscore-to-camel-case=true

spring.config.import=classpath:secret.properties